})</script><script>((getMarkmap, getOptions, root2, jsonOptions) => {
              const markmap = getMarkmap();
              // =====

              const options = (getOptions || markmap.deriveOptions)(jsonOptions);
              // options.zoom = false; // 禁止滑鼠滾輪縮放

              // 加快縮放速度
              // options.duration = 200;

              window.mm = markmap.Markmap.create(
                "svg#mindmap",
                options,
                root2
              );

              // 禁止滑鼠滾輪縮放
              const svg = d3.select("svg#mindmap");
              svg.on("wheel", function(event){
                event.preventDefault();
              }, { passive:false });

              // // 雙擊重新適應畫面
              // 雙擊位置放大
              svg.on("dblclick", function(event){
                const svgElement = document.querySelector("#mindmap");
                const rect = svgElement.getBoundingClientRect();

                // 取得滑鼠在 SVG 的位置
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const scale = 2;

                const transform = d3.zoomIdentity
                  .translate(
                    rect.width / 2 - x * scale,
                    rect.height / 2 - y * scale
                  )
                  .scale(scale);

                svg
                  .transition()
                  .duration(500)

                  .call(
                    d3.zoom().transform,
                    transform
                  );
              });
              // =====
              if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.classList.add("markmap-dark");
              }
